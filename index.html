<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sipesa - Tarjeta de Contacto</title>
    <!-- Fuente Montserrat para un diseño pulido -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Paleta de colores basada en SIPESA */
        :root {
            --sipesa-yellow: #facc15; /* Amarillo de la grúa */
            --sipesa-black: #111827;
            --whatsapp-green: #25d366;
            --bg-page: #e5e7eb;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Estructura de la tarjeta con sombra suave */
        .vcard {
            background: var(--card-bg);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            /* Animación al cargar */
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Cabecera con imagen y degradado */
        .header-bg {
            background: 
                /* 1. Un degradado negro traslúcido encima de la imagen */
                linear-gradient(to bottom, rgba(17, 24, 39, 0.95) 0%, rgba(17, 24, 39, 0.1) 100%),
                /* 2. La imagen de fondo */
                url('https://framerusercontent.com/images/2x49OK0wSPZQ1HOCgskCmynlzFg.jpg?scale-down-to=512') no-repeat;
            
            background-size: cover; /* Para que la imagen cubra todo el espacio */
            background-position: center; /* Para centrar la imagen */
            height: 130px;
            position: relative;
        }

        /* Curva inferior de la cabecera */
        .header-bg::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 30px;
            background: var(--card-bg);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        /* Contenedor del Logo Flotante */
        .brand-logo {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 2;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid white;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            /* Sombra suave para que el logo resalte más */
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
        }

        .content {
            padding: 50px 24px 30px;
            text-align: center;
        }

        .profile h1 {
            font-size: 1.25rem;
            color: var(--sipesa-black);
            margin: 0 0 5px;
            font-weight: 700;
        }

        .profile h2 {
            font-size: 0.85rem;
            color: #d97706; /* Un tono oscuro del amarillo para lectura */
            margin: 0 0 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Lista de detalles de contacto (Estilo moderno) */
        .info-list {
            text-align: left;
            margin-bottom: 25px;
            padding: 10px 15px;
            background: #f9fafb;
            border-radius: 16px;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
            text-decoration: none;
            color: var(--sipesa-black);
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .info-item:last-child { border-bottom: none; }
        .info-item:hover { color: #d97706; transform: translateX(5px); }

        .icon-box {
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: var(--sipesa-black);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        /* Botones interactivos */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn i { margin-right: 8px; font-size: 1.1rem; }

        .btn-primary {
            background: var(--sipesa-black);
            color: white;
            border: 2px solid var(--sipesa-black);
        }
        .btn-primary:hover { background: transparent; color: var(--sipesa-black); }

        .btn-whatsapp {
            background: var(--whatsapp-green);
            color: white;
            box-shadow: 0 8px 15px rgba(37, 211, 102, 0.2);
        }
        .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 12px 20px rgba(37, 211, 102, 0.3); }

        .btn-outline {
            border: 2px solid #e5e7eb;
            color: var(--sipesa-black);
            background: transparent;
        }
        .btn-outline:hover { border-color: var(--sipesa-black); }

        /* QR Integrado de forma sutil abajo */
        .qr-wrapper {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #d1d5db;
        }
        .qr-wrapper p {
            font-size: 0.8rem;
            color: #6b7280;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        .qr-wrapper img {
            width: 110px;
            border-radius: 12px;
            padding: 6px;
            background: white;
            border: 1px solid #e5e7eb;
            transition: transform 0.3s;
        }
        .qr-wrapper img:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="vcard">

        </div>

        <div class="content">

            <div class="profile">

            <div class="info-list">
                <a href="tel:+573008084304" class="info-item">

                    <span>operaciones.caribe@sipesa.co</span>

                    <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>

                </div>
            </div>

            <!-- Botones de Acción -->
            <a href="contacto.vcf" download="Rafael_Pena_SIPESA.vcf" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> Guardar Contacto
            </a>
            
            <a href="https://wa.me/573008084304?text=Hola,%20solicito%20una%20cotización%20(Vía%20tarjeta%20digital)" target="_blank" class="btn btn-whatsapp">

            <div class="qr-wrapper">
                <p>Escanea para compartir</p>
                <!-- Solo cambia AQUI_TU_LINK_DE_GITHUB por tu URL real de GitHub Pages cuando la tengas -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://jesusruiz-eng.github.io/sipesa/" alt="Código QR Sipesa">
            </div>
        </div>
    </div>

</body>
</html>
